<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>姪浜駅 空調衛生設備 点検入力</title>
<style>
:root{
  color-scheme:light only;
  --bg:#F0EEE6;--surface:#FAF9F5;--white:#FFFFFF;
  --line:#E0DDD2;--line2:#CFCBBD;
  --hi:#D97757;--hi-dim:#BE5F41;--hi-soft:#F7EBE4;
  --ink:#1F1E1C;--muted:#78756C;
  --fault:#BC3B2E;--warn:#B4761A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --jp:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg) !important;min-height:100%}
body{margin:0;background:var(--bg) !important;min-height:100vh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;background:var(--bg);z-index:-1;pointer-events:none}
#app{position:relative;z-index:0}
body{font-family:var(--jp);color:var(--ink);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:var(--jp);cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:660px;margin:0 auto;padding:0 10px 100px}

/* ===== ヘッダー ===== */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:660px;margin:0 auto;padding:9px 12px 8px}
.sta{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sta b{font-size:16px;font-weight:700;letter-spacing:.04em}
.sta span{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink)}
.gauge{height:7px;background:#E4E1D7;border-radius:4px;margin-top:7px;display:flex;overflow:hidden}
.gauge i{height:100%;transition:width .3s ease}
.gauge .mine{
  background:linear-gradient(180deg,#B6F06A 0%,#5CCB63 42%,#189A52 62%,#7FE08C 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(0,0,0,.14)}
.gauge .buddy{
  background:linear-gradient(180deg,#D7F3B4 0%,#A9DCA8 45%,#7FBE96 62%,#C4E9C6 100%);
  opacity:.75}
.gtxt{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px}
.gtxt b{color:var(--ink)}

/* ===== 点検情報バー / 相方 ===== */
.slim{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;margin-top:8px;font-size:13px;text-align:left}
.slim .k{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;flex:0 0 auto}
.slim .v{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slim .go{color:var(--hi-dim);font-size:18px;font-weight:700;flex:0 0 auto}
.slim.buddy .dot{width:8px;height:8px;border-radius:50%;background:var(--hi);flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(217,119,87,.18);animation:blink 2.2s infinite}
.slim.buddy.off{color:var(--muted)}
.slim.buddy.off .dot{background:#C2BEB2;box-shadow:none;animation:none}
.slim.buddy b{color:var(--hi-dim)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== グループ ===== */
.gl{display:flex;align-items:baseline;gap:8px;margin:14px 2px 6px}
.gl h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.gl .rule{flex:1;height:0;border-top:1px solid var(--ink);align-self:center}
.gl .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* ===== セル ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:6px}
.cell{position:relative;background:var(--surface);border:1.5px dotted var(--ink);border-radius:8px;
  padding:8px 8px 9px;text-align:left;min-height:66px;display:flex;flex-direction:column;justify-content:space-between;
  overflow:hidden}
.cell:active{background:#F2F0E8}
.cell .sym{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.01em;line-height:1.25}
.cell .nm{font-size:10.5px;color:var(--muted);line-height:1.3;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .st{font-family:var(--mono);font-size:10.5px;color:#B5B1A5;margin-top:5px;font-weight:700}
.cell.part .st{color:var(--ink)}
.cell.full{
  border:2px solid transparent;padding:7px 7px 8px;
  background-image:linear-gradient(180deg,#FAFFFC,#EDF9F2),linear-gradient(140deg,#8FF0C0 0%,#1FA968 38%,#0E7C4A 62%,#6FE3AE 100%);
  background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:0 0 0 1px rgba(14,124,74,.12),0 2px 7px rgba(14,124,74,.18),inset 0 1px 0 rgba(255,255,255,.9)}
.cell.full .st{color:#12905A}
.cell.full .nm{color:#5C7E6C}
.cell.none{opacity:.45}
.cell .flag{position:absolute;top:0;right:0;font-family:var(--mono);font-size:9.5px;font-weight:700;
  padding:2px 6px;border-bottom-left-radius:7px;color:#fff}
.cell.hasWarn .flag{background:var(--warn)}
.cell.hasFault .flag{background:var(--fault)}

/* ===== ぼかし ===== */
#app{transition:filter .18s ease}
#app.blurred{filter:blur(4px) saturate(.9);pointer-events:none}

/* ===== ポップアップ ===== */
.pop{position:fixed;inset:0;z-index:60;display:none;overscroll-behavior:contain;align-items:center;justify-content:center;padding:14px;
  background:rgba(31,30,28,.42)}
.pop.show{display:flex}
.panel{width:100%;max-width:430px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--white);
  border-radius:14px;box-shadow:0 18px 50px rgba(31,30,28,.3);animation:rise .18s ease}
@keyframes rise{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.phead{position:sticky;top:0;z-index:5;background:var(--white);border-bottom:1px solid var(--line);
  padding:14px 16px 11px;border-radius:14px 14px 0 0}
.phead .sym{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--ink)}
.phead .nm{font-size:13px;color:var(--muted);margin-top:1px}
.phead .x{position:absolute;top:8px;right:8px;width:40px;height:40px;font-size:22px;color:var(--muted);line-height:1}
.pbody{padding:14px 16px 4px}

/* ===== メモ ===== */
.phead.hasMemo{padding-right:144px}
.memoBtn{position:absolute;top:12px;right:80px;height:34px;padding:0 12px;border-radius:8px;
  border:1.5px dotted var(--ink);background:var(--white);color:var(--ink);
  font-size:12.5px;font-weight:700;line-height:1;white-space:nowrap}
.memoBtn.on{background:var(--ink);color:#fff;border-style:solid}
.cell .mdot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:5px;
  background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.cell.hasWarn .mdot{top:5px;right:40px}
.cell.hasFault .mdot{top:5px;right:50px}
.mgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:86px;height:86px;border-radius:8px;overflow:hidden;
  border:1.5px dotted var(--ink);background:var(--bg);flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .del{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:13px;
  background:rgba(31,30,28,.8);color:#fff;font-size:14px;line-height:1;padding:0}
.addPh{width:86px;height:86px;border-radius:8px;border:1.5px dotted var(--line2);
  background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;line-height:1.4;flex:0 0 auto}
.mhint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
.fld{margin-bottom:16px}
.fld .lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px}
.fld .lab b{font-size:14px;font-weight:700}
.fld .lab span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.row{display:flex;gap:8px}
input,select,textarea{font-family:var(--mono);font-size:23px;font-weight:700;color:var(--ink);width:100%;
  min-height:58px;padding:8px 12px;border:1.5px dotted var(--ink);background:var(--white);border-radius:8px}
textarea{font-family:var(--jp);font-size:15px;font-weight:400;min-height:auto;line-height:1.55;padding:11px 12px}
select{font-family:var(--jp);font-size:17px;font-weight:600}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(31,30,28,.22);border-color:var(--ink)}
input.ok{
  border:1.5px solid transparent;
  background-image:linear-gradient(180deg,#FFFFFF,#F4FDF8),
                   linear-gradient(140deg,#8FF0C0 0%,#1FA968 38%,#0E7C4A 62%,#6FE3AE 100%);
  background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:0 0 0 1px rgba(14,124,74,.10),0 2px 8px rgba(14,124,74,.16),inset 0 1px 0 rgba(255,255,255,.9)}
input.warn{border-color:var(--warn)}
input.bad{border-color:var(--fault)}
input::placeholder{color:#BEBAAE}
.unit{display:flex;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);flex:0 0 auto;min-width:40px}
.same{flex:0 0 auto;min-width:88px;border:2px solid var(--hi);border-radius:8px;background:var(--hi-soft);
  color:var(--hi-dim);font-size:12.5px;font-weight:700;line-height:1.25}
.same:active{background:var(--hi);color:#fff}
.dwg{flex:0 0 auto;min-width:56px;border:1.5px dotted var(--ink);border-radius:8px;background:var(--white);
  color:var(--ink);font-size:11.5px;font-weight:700;line-height:1.35;white-space:nowrap}
.cam{flex:0 0 auto;min-width:52px;border:1.5px dotted var(--ink);border-radius:8px;background:var(--white);
  color:var(--ink);font-size:12px;font-weight:700;line-height:1.35;white-space:nowrap}
.cam:disabled{color:var(--muted);border-color:var(--line2)}
.camMsg{display:none;font-size:12px;font-weight:700;color:var(--warn);margin-top:7px;line-height:1.5}
.camMsg.show{display:block}
.campane{display:none;margin-top:9px}
.campane.show{display:block}
.campane img{display:block;width:100%;max-height:220px;object-fit:contain;background:var(--bg);
  border:1.5px dotted var(--ink);border-radius:8px}
.camnote{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
.camrow{display:flex;gap:7px;margin-top:7px}
.camrow .mini{flex:1;min-width:0;padding:0 6px;font-size:12.5px}
.mini.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.mini.go:disabled{background:#DAD6CA;color:#96927F;border-color:#DAD6CA}
.msg{font-size:12.5px;margin-top:7px;display:none;font-weight:700;line-height:1.45}
.msg.show{display:block}
.msg.warn{color:var(--warn)}.msg.fault{color:var(--fault)}.msg.ok{color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:2px solid var(--line2);border-radius:8px;background:var(--white);padding:11px 14px;
  font-family:var(--mono);font-size:15px;font-weight:700;min-height:50px}
.chip[aria-pressed=true]{background:var(--white);color:var(--ink);border:3px solid var(--ink)}
.pfoot{position:sticky;bottom:0;z-index:5;background:var(--white);border-top:1px solid var(--line);
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));display:flex;gap:9px;border-radius:0 0 14px 14px}
.pair{display:flex;gap:8px}.pair>div{flex:1;min-width:0}
.lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;background:var(--hi-soft);border-radius:8px;padding:10px 12px}

/* ===== ボタン ===== */
.btn{flex:1;min-height:54px;border-radius:9px;background:var(--ink);color:#fff;font-size:15.5px;font-weight:700;letter-spacing:.04em}
.btn:disabled{background:#DAD6CA;color:#96927F}
.btn.ghost{flex:0 0 auto;min-width:100px;background:transparent;color:var(--ink);border:2px solid var(--line2)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(240,238,230,.94);
  border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bottom .in{max-width:660px;margin:0 auto;display:flex;gap:8px}

/* ===== 出力 ===== */
.out{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:10px;white-space:pre;overflow-x:auto;margin:0 0 8px;line-height:1.75}
.out-lbl{font-family:var(--mono);font-size:11.5px;color:var(--hi-dim);margin:14px 0 5px;font-weight:700;letter-spacing:.05em}
.mini{min-height:44px;padding:0 14px;border:2px solid var(--line2);border-radius:7px;font-size:13.5px;font-weight:700}

/* ===== 履歴 ===== */
.hist{margin-top:9px;border-top:1px dashed var(--line2);padding-top:8px}
.hist .hl{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:5px}
.spark{display:block;width:100%;height:34px;margin-bottom:5px}
.hscroll{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;touch-action:pan-x pan-y}
.hcell{flex:0 0 auto;min-width:66px;text-align:center;border:1px solid var(--line);border-radius:6px;
  padding:4px 6px;background:var(--bg)}
.hcell .d{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.hcell .n{font-family:var(--mono);font-size:13px;font-weight:700;line-height:1.3}
.hcell .dl{font-family:var(--mono);font-size:10px;line-height:1.25;color:var(--muted);
  margin-top:2px;padding-top:2px;border-top:1px dotted var(--line2)}
.hcell.last{border-color:var(--ink)}
.hcell.last .n{color:var(--ink)}
.hcell.last .d{color:var(--ink)}
.hcell.bad .n{color:var(--warn)}
.hcell .dl.up{color:var(--ink)}
.hcell .dl.over{color:var(--warn);font-weight:700}
.hcell .dl.minus{color:var(--fault);font-weight:700}
.wide{max-width:min(96vw,900px)}
/* 履歴表：横スクロール。左端の項目名だけ固定 */
.scrollx{overflow-x:auto;overflow-y:hidden;touch-action:pan-x pan-y;
  border:1px solid var(--line);border-radius:8px;background:var(--white);
  position:relative;z-index:0;isolation:isolate;contain:paint}
.tbl{border-collapse:separate;border-spacing:0;width:max-content;
  font-family:var(--mono);font-size:12px}
.tbl td{height:30px;padding:0 8px;border-bottom:1px solid var(--line);
  white-space:nowrap;text-align:right;min-width:66px;background:var(--white)}
.tbl td.h{position:sticky;left:0;z-index:2;text-align:left;
  font-family:var(--jp);font-size:11px;font-weight:600;
  min-width:146px;max-width:146px;overflow:hidden;text-overflow:ellipsis;
  border-right:1px solid var(--line2)}
.tbl tr.grp td{background:var(--bg);color:var(--muted);font-size:10.5px;font-weight:700}
.tbl tr.grp td.h{font-family:var(--jp);font-size:11px;letter-spacing:.04em;color:var(--ink)}
.tbl td.now{background:#F1FAF5;color:#0E7C4A;font-weight:700}
.tbl td.bad{color:var(--warn);font-weight:700}
.swipehint{font-size:11.5px;color:var(--muted);margin-bottom:7px}

/* ===== 現場メモ（点検表の欄外にある注記） ===== */
.tip{font-size:12px;line-height:1.65;color:var(--ink);background:var(--hi-soft);
  border-radius:8px;padding:9px 11px;margin:0 2px 8px}
.tip b{color:var(--hi-dim);font-weight:700}
.tip.item{margin:0 0 14px}

/* ===== 総括（Excel「姪浜総括」と同じ並び。A4横1ページ） ===== */
/* 列幅・行高・結合はExcelの実測値。Excel側は A4横・81%・上下左右中央で組まれている */
.rep .repnote{font-size:11.5px;line-height:1.6;color:var(--muted);margin-top:8px}
.repwarn{border:1.5px solid var(--warn);background:#FDF6EA;border-radius:8px;
  padding:9px 11px;font-size:12.5px;line-height:1.7;margin-bottom:10px}
.repwarn b{color:var(--warn);font-weight:700}
.repbad{border-color:var(--fault);background:#FBEDEB}
.repbad b{color:var(--fault)}
.repok{border:1px solid #BFE6D2;background:#F2FBF6;border-radius:8px;padding:9px 11px;
  font-size:12.5px;color:#0E7C4A;font-weight:700;margin-bottom:10px}
.prbtn{position:absolute;top:12px;right:52px;height:34px;padding:0 12px;border-radius:8px;
  border:1.5px dotted var(--ink);background:var(--white);color:var(--ink);
  font-size:12.5px;font-weight:700;line-height:1;white-space:nowrap}
.panel.xlwide{max-width:min(98vw,1120px)}
.shwrap{overflow-x:auto;overflow-y:hidden;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:8px;background:var(--white)}
.sheet{width:277mm;padding:4mm 3mm;background:var(--white)}
table.xl{width:100%;border-collapse:collapse;table-layout:fixed;
  font-family:var(--jp);font-size:8pt;color:var(--ink)}
table.xl td{border:.5pt solid #D3CFC2;padding:0 1.1mm;white-space:nowrap;
  overflow:hidden;line-height:1.15;vertical-align:middle}
/* 見出し */
table.xl td.hd{background:#F0EEE6;color:#6C6A62;font-size:7pt;font-weight:700;text-align:center;
  letter-spacing:.02em}
table.xl td.band{background:#E8E3D7;color:var(--ink);font-size:8pt;font-weight:700;
  text-align:center;letter-spacing:.06em}
/* 帳票の外（表題・年度・点検日・No.） */
table.xl td.ttl{border:0;font-size:11.5pt;font-weight:700;letter-spacing:.01em}
table.xl td.mlab{border:0;font-size:7.5pt;color:#6C6A62;text-align:right;padding-right:1.5mm}
table.xl td.mval{border:0;font-family:var(--mono);font-size:10pt;font-weight:700;text-align:left}
table.xl td.mval.c{text-align:center}
/* 本文 */
table.xl td.sy{font-size:8pt;font-weight:700;padding:0 .3mm;text-align:justify;text-align-last:justify;
  -webkit-text-align-last:justify}
table.xl td.sy.s10{font-size:7.3pt}   /* ＰＡＣ－７１ など（Excel 10pt） */
table.xl td.sy.s9{font-size:6.5pt}    /* ＭＡＣ－２１（Excel 9pt） */
table.xl td.nm{font-size:8pt}
table.xl td.n{font-family:var(--mono);font-size:8.5pt;font-weight:700;text-align:right;
  font-variant-numeric:tabular-nums}
table.xl td.std{font-family:var(--mono);font-size:8pt;font-weight:400;color:#9C9788;text-align:right}
table.xl td.ctr{text-align:center}
table.xl td.rmk{font-size:8pt;text-align:left}
table.xl td.hd.rmk{font-size:6.5pt;text-align:left}  /* 冷媒圧力の名称（Excel 9pt） */
table.xl td.miss{color:var(--fault)}
table.xl td.warn{color:var(--warn)}
table.xl td.fault{color:var(--fault)}
table.xl td.void{border:0;background:transparent}
.swipe2{font-size:11.5px;color:var(--muted);margin-bottom:6px}

/* ===== 印刷（総括をA4横1ページで出す） ===== */
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{background:#fff !important}
  /* openPop が body に付ける overflow:hidden / height を印刷時だけ戻す */
  body{overflow:visible !important;height:auto !important}
  body::before{display:none}
  #app,.bottom{display:none !important}
  .pop{position:static;display:block;background:none;padding:0;overscroll-behavior:auto}
  .panel,.panel.xlwide{max-width:none;max-height:none;overflow:visible;box-shadow:none;
    border-radius:0;animation:none;width:auto}
  .phead,.pfoot,.prbtn,.phead .x,.swipe2,.repnote,.repwarn,.repok{display:none !important}
  .pbody{padding:0}
  .shwrap{overflow:visible;border:0;border-radius:0;background:none}
  .sheet{width:auto;padding:0}
  table.xl{page-break-inside:avoid}
}

/* ===== チェックボックス ===== */
input[type=checkbox]{width:26px;height:26px;min-height:26px;padding:0;margin:0;border:0;
  accent-color:#12905A;flex:0 0 auto;border-radius:0;background:none}
.chk{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:#F2FBF6;border:1px solid #BFE6D2;border-radius:9px;padding:11px 12px;
  font-size:13.5px;font-weight:700;color:#0E7C4A;cursor:pointer}
.chk.off{background:var(--surface);border-color:var(--line);color:var(--muted)}
.chk .sub{font-weight:400;font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
.chk .tx{flex:1;min-width:0}
.chkbar{margin-top:8px}
.pbody .chk{margin-bottom:15px}

.chkrow{display:flex;gap:6px;margin-top:8px}
.chkrow .chk{margin-top:0}
.chk.neutral{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.chk.neutral input[type=checkbox]{
  -webkit-appearance:none;appearance:none;width:26px;height:26px;border:2px solid var(--ink);
  border-radius:5px;background:#fff;position:relative}
.chk.neutral input[type=checkbox]:checked::after{
  content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;
  border:solid var(--ink);border-width:0 2.6px 2.6px 0;transform:rotate(45deg)}
.chk .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);flex:0 0 auto}

function badHist(f,arr,i){
  const v=arr[i];
  if(v===null||v===undefined)return false;
  const p=i>0?arr[i-1]:null;
  switch(f.t){
    case"cur":  return typeof v==="number"&&v>f.std;
    case"press":return typeof v==="number"&&(v<f.rng[0]||v>f.rng[1]);
    case"hour":
    case"kwh":  return typeof p==="number"&&typeof v==="number"&&v<p;
    case"volt": return typeof p==="number"&&typeof v==="number"&&(v<p*0.9||v>p*1.1);
    case"temp": return typeof v==="number"&&(v<16||v>30);
    case"choice":return v==="不";
  }
  return false;
}

/* ============ 検証 ============ */
function check(f,v){
  const p=f.prev;
  switch(f.t){
    case"cur":
      if(v>f.std)return{lv:"warn",tx:`基準値 ${f.std}A を超えています（前回 ${p}A）。読み値を確認してください。`};
      if(p>0&&(v>p*2||v<p*0.4))return{lv:"warn",tx:`前回から大きく変わっています ${v>p?"+":""}${(v-p).toFixed(1)}A`};
      return null;
    case"hour":
      if(v<p)return{lv:"fault",tx:`前回 ${p}H より小さい値です。積算計は戻りません。`};
      if(v-p>200)return{lv:"warn",tx:`前回から +${(v-p).toFixed(1)}H。1週間の上限は約168Hです。`};
      return{lv:"ok",tx:`前回差 +${(v-p).toFixed(1)}H`};
    case"kwh":
      if(v<p)return{lv:"fault",tx:`前回 ${p.toLocaleString()} より小さい値です。`};
      if(String(Math.floor(v)).length!==String(Math.floor(p)).length)
        return{lv:"warn",tx:"桁数が前回と違います。打ち間違いの可能性があります。"};
      return{lv:"ok",tx:`使用電力量 ${(v-p).toLocaleString()} kWh`};
    case"press":
      if(v<f.rng[0]||v>f.rng[1])
        return{lv:"warn",tx:`基準範囲 ${f.rng[0]}〜${f.rng[1]} の外です`+((p<f.rng[0]||p>f.rng[1])?`（前回 ${p} も範囲外）`:"")};
      return null;
    case"volt":
      if(v<p*0.9||v>p*1.1)return{lv:"warn",tx:`前回 ${p}V から10%以上ずれています。`};
      return null;
    case"temp":
      if(v<16||v>30)return{lv:"warn",tx:"設定温度の範囲を確認してください。"};
      return null;
  }
  return null;
}

function memoOf(id){return memo[id]||(memo[id]={t:"",ph:[]});}

/* 写真は長辺1400pxのJPEGに縮めてから持つ（原寸だと端末が落ちる） */
function shrink(file,max=1400,q=.72){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onerror=()=>res(null);
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>res(fr.result);
      im.onload=()=>{
        try{
          const s=Math.min(1,max/Math.max(im.width,im.height));
          const w=Math.round(im.width*s),h=Math.round(im.height*s);
          const c=document.createElement("canvas");c.width=w;c.height=h;
          c.getContext("2d").drawImage(im,0,0,w,h);
          res(c.toDataURL("image/jpeg",q));
        }catch(e){res(fr.result);}
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

}

/* ===== 備考は最後の欄が埋まったら次を足す（備考2→3→4…） ===== */
const RM_MIN=2;
const rmFilled=(it,f)=>String(val[it.id+"."+f.id]||"").trim()!=="";
function growRemarks(it,addField){
  if(it.id!=="rm")return;
  const last=it.f[it.f.length-1];
  if(!last||last.t!=="text"||!rmFilled(it,last))return;
  const n=it.f.length+1;
  const f={id:"r"+n,lab:"備考 "+n,t:"text",prev:""};
  it.f.push(f);val[it.id+"."+f.id]="";
  addField(f,it.f.length-1);
}
/* 開き直したとき、末尾の空欄は1つ残して片づける */
function trimRemarks(it){
  if(it.id!=="rm")return;
  while(it.f.length>RM_MIN&&!rmFilled(it,it.f[it.f.length-1])){
    delete val[it.id+"."+it.f.pop().id];
  }
}

/* ============ メーター読み取り（写真→AI→数値） ============ */
/* ↓ Cloudflare Worker を立てたら、そのURLをここに入れるだけで動きます。
   空のままなら「読み取り先が未設定」と出るだけで、手入力の邪魔はしません。 */
const OCR_ENDPOINT="";
/* 読み取りを付ける項目。現場ごとにメーターが違うので、まずは数字がそのまま並ぶ2つだけ */
const OCR_TYPES=["hour","kwh"];

/* 前回値から桁の形を作る。「5桁＋小数1桁」と先に教えると誤読が激減する */
function digitHint(f){
  const [a,b]=String(f.prev).split(".");
  return `整数${a.replace("-","").length}桁`+(b?`＋小数${b.length}桁`:"（小数なし）");
}
async function readMeter(it,f,dataURL){
  if(!OCR_ENDPOINT)throw new Error("未設定");
  const r=await fetch(OCR_ENDPOINT,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      item:it.sym,label:f.lab,unit:f.unit||"",prev:f.prev,
      format:digitHint(f),image:dataURL
    })
  });
  if(!r.ok)throw new Error("HTTP "+r.status);
  const raw=await r.text();
  let t=raw;
  try{const j=JSON.parse(raw);t=j.value??j.text??j.result??raw;}catch(e){}
  const n=String(t).replace(/[^0-9.\-]/g,"");
  if(n===""||isNaN(parseFloat(n)))throw new Error("数値を読めません");
  return n;
}
function camButton(it,f,input,fld){

  const pane=el("div","campane");fld.appendChild(pane);
  const hint=el("div","camMsg");fld.appendChild(hint);
  const say=t=>{hint.textContent=t;hint.classList.add("show");};
  const clear=()=>hint.classList.remove("show");
  let shot=null;

  const file=document.createElement("input");
  file.type="file";file.accept="image/*";file.capture="environment";file.style.display="none";
  file.onchange=async()=>{
    const f0=file.files[0];file.value="";
    if(!f0)return;
    b.disabled=true;b.innerHTML="読込中…";clear();
    shot=await shrink(f0,1600,.85);
    b.disabled=false;b.innerHTML="📷<br>AI";
    render();
  };

  function render(){
    pane.innerHTML="";
    pane.classList.toggle("show",!!shot);
    if(!shot)return;
    const im=document.createElement("img");im.src=shot;pane.appendChild(im);
    pane.appendChild(el("div","camnote","数字がはっきり読めるか確認してから解析してください。"));
    const rw=el("div","camrow");

    const go=el("button","mini go","この写真で解析");go.type="button";
    go.onclick=async()=>{
      if(!OCR_ENDPOINT){
        say("APIキーが未設定です。会社から発行されたら、読み取り先のURLを登録すると使えるようになります。");
        return;
      }
      clear();go.disabled=true;go.textContent="解析中…";
      try{
        const n=await readMeter(it,f,shot);
        input.value=n;input.dispatchEvent(new Event("input"));
        shot=null;render();
      }catch(e){
        say("読み取れませんでした（"+e.message+"）。撮り直すか、手で入力してください。");
        go.disabled=false;go.textContent="この写真で解析";

  b.appendChild(file);
  return b;

/* ============ 履歴の表示 ============ */
/* 前回からの増加ぶんを併記する項目の種類と、下段の呼び名 */
const DELTA_LABEL={hour:"前回からの稼働時間",kwh:"前回からの使用電力量"};
/* 1週間の稼働上限の目安（H）。これを超えたら橙 */
const HOUR_CAP=168;
/* 差の書き方：時間は小数1桁、電力量は3桁区切り（端数があれば1桁だけ残す） */
function deltaFmt(t,a){
  if(t==="hour")return a.toFixed(1);
  const r=Math.round(a*10)/10;
  return Number.isInteger(r)?r.toLocaleString():r.toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
}
function deltaLine(f,arr,i){
  if(!DELTA_LABEL[f.t])return null;
  const v=arr[i],p=i>0?arr[i-1]:null;
  if(typeof v!=="number")return null;
  if(typeof p!=="number")return{tx:"—",cls:""};
  const d=v-p;
  const tx=(d>=0?"+":"−")+deltaFmt(f.t,Math.abs(d));
  if(d<0)return{tx,cls:"minus"};
  if(f.t==="hour"&&d>HOUR_CAP)return{tx,cls:"over"};
  return{tx,cls:d>0?"up":""};
}

function histStrip(hs,f){
  const box=el("div","hist");
  box.appendChild(el("div","hl",DELTA_LABEL[f.t]
    ?"過去の点検値（新しい順に右）／下段は"+DELTA_LABEL[f.t]
    :"過去の点検値（新しい順に右）"));
  const nums=hs.map(x=>typeof x.v==="number"?x.v:null).filter(x=>x!==null);
  if(nums.length>2){
    const mn=Math.min(...nums),mx=Math.max(...nums),W=300,H=34,pad=3;
    const pts=hs.map((x,i)=>{
      if(typeof x.v!=="number")return null;
      const px=pad+i*(W-pad*2)/(hs.length-1);
      const py=mx===mn?H/2:H-pad-((x.v-mn)/(mx-mn))*(H-pad*2);
      return px.toFixed(1)+","+py.toFixed(1);
    }).filter(Boolean);
    const svg=`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`+
      `<polyline points="${pts.join(" ")}" fill="none" stroke="#1F1E1C" stroke-width="1" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`+
      `<circle cx="${pts[pts.length-1].split(",")[0]}" cy="${pts[pts.length-1].split(",")[1]}" r="2.2" fill="#1F1E1C"/></svg>`;
    box.insertAdjacentHTML("beforeend",svg);
  }
  const sc=el("div","hscroll");
  const arr=hs.map(y=>y.v);
  hs.forEach((x,i)=>{
    const c=el("div","hcell");
    if(i===hs.length-1)c.classList.add("last");
    if(badHist(f,arr,i))c.classList.add("bad");
    let h=`<div class="d">${x.d}</div><div class="n">${x.v===null||x.v===undefined?"—":x.v}</div>`;
    const dl=deltaLine(f,arr,i);
    if(dl)h+=`<div class="dl ${dl.cls}">${dl.tx}</div>`;
    c.innerHTML=h;
    sc.appendChild(c);
  });
  box.appendChild(sc);
  setTimeout(()=>{sc.scrollLeft=sc.scrollWidth;},60);
  return box;
}

function me(){return info.whoA||"";}
function mark(k){meta[k]={by:me()||"—",at:Date.now()};saveSoon();}
let pushTmr=null;
function pushSoon(){if(!SYNC)return;clearTimeout(pushTmr);pushTmr=setTimeout(sync,700);}
function focusedKey(){
  const a=document.activeElement;
  return a&&a.dataset?a.dataset.key:null;
}
let syncing=false;
async function sync(){
  if(!SYNC||!window.storage||syncing)return;
  syncing=true;
  let rem={f:{},p:{}};
  try{const r=await window.storage.get(KEY,true);if(r)rem=JSON.parse(r.value)||{};}catch(e){}
  rem.f=rem.f||{};rem.p=rem.p||{};
  const fk=focusedKey();
  let pulled=false,push=false;
  Object.keys(rem.f).forEach(k=>{
    if(k===fk)return;
    const r=rem.f[k],l=meta[k];
    if(!l||r.at>l.at){
      if(val[k]!==r.v){val[k]=r.v;pulled=true;}
      meta[k]={by:r.by,at:r.at};
    }
  });
  Object.keys(meta).forEach(k=>{
    const l=meta[k],r=rem.f[k];
    if(!r||l.at>r.at){rem.f[k]={v:val[k]===undefined?"":val[k],by:l.by,at:l.at};push=true;}
  });
  const n=me();
  if(n){rem.p[n]=Date.now();push=true;}
  if(push){try{await window.storage.set(KEY,JSON.stringify(rem),true);}catch(e){}}
  syncing=false;
  if(pulled){
    Object.keys(val).forEach(k=>{
      const f=fieldByKey(k);
      if(!f)return;
      stat[k]="";
      const v=nz(val[k]);
      if(v!==null){const r=check(f,v);if(r&&r.lv!=="ok")stat[k]=r.lv;}
      if(f.t==="choice"&&!val[k])stat[k]="warn";
      if(f.t==="choice"&&val[k]==="不")stat[k]="fault";
    });
    if(curItem&&!fk)openItem(curItem,true);else draw();
  }
  paintBuddy(rem);
}
function fieldByKey(k){
  const [iid,fid]=k.split(".");
  const it=ITEMS.find(x=>x.id===iid);
  return it?it.f.find(x=>x.id===fid):null;
}
function paintBuddy(rem){
  const n=me();
  const others=[...new Set(Object.keys(rem.f||{}).map(k=>rem.f[k].by).filter(b=>b&&b!=="—"&&b!==n))];
  Object.keys(rem.p||{}).forEach(p=>{if(p!==n&&Date.now()-rem.p[p]<3600000&&!others.includes(p))others.push(p);});
  const bar=$("#buddyBar"),txt=$("#buddyTxt");
  if(!others.length){bar.classList.add("off");txt.textContent="相方の入力を待っています";return;}
  const name=others[0];
  const cnt=keys.filter(k=>has(k)&&meta[k]&&meta[k].by===name).length;
  const last=ITEMS.slice().reverse().find(it=>it.f.some(f=>meta[it.id+"."+f.id]&&meta[it.id+"."+f.id].by===name));
  bar.classList.remove("off");
  txt.innerHTML=`<b>${name}</b> さん　${cnt} 項目を入力`+(last?`　最後：${last.sym}`:"");
}
if(SYNC){setInterval(sync,3000);sync();}
else{const bb=$("#buddyBar");if(bb)bb.style.display="none";}

const d2=v=>(v===null||v===undefined)?"":(Math.round(v*100)/100).toFixed(2);
const dI=v=>(v===null||v===undefined)?"":Math.round(v).toLocaleString();
/* 総括の「運転時間」「使用量」は前回からの差。Excel側は蓄積シートの引き算で出している */
function diffOf(k){
  const a=gvn(k),f=fieldByKey(k);
  if(a===null||!f||typeof f.prev!=="number")return null;
  return Math.round((a-f.prev)*10)/10;
}
function nendo(ds){
  const p=String(ds||"").split("-").map(Number);
  return p[0]?"令和"+((p[1]>=4?p[0]:p[0]-1)-2018)+"年度":"";
}
function jdate(ds){
  const p=String(ds||"").split("-").map(Number);
  return p[0]?p[0]+"年"+p[1]+"月"+p[2]+"日":"";
}
function mdOf(ds){
  const p=String(ds||"").split("-").map(Number);
  return p[0]?p[1]+"/"+p[2]:"";
}

  return '<td class="n '+(cls||"")+" "+scls(k)+'">'+txt+'</td>';

    '運転時間は「今回の積算時間 − 前回の積算時間」、使用量は「今回の読み値 − 前回の読み値」。'+
    '赤は未入力、橙は基準値・前回比の注意です。</div>');
  frag.appendChild(body);

  const foot=el("div","pfoot");
  const cb=el("button","btn ghost","閉じる");cb.onclick=closePop;foot.appendChild(cb);
  const ob=el("button","btn","転記用データを出す");ob.onclick=openOutput;foot.appendChild(ob);
  frag.appendChild(foot);
  openPop(frag,true);
  $("#panel").classList.add("xlwide");
  requestAnimationFrame(()=>{$("#panel").scrollTop=0;});
}

/* ============ 端末に残す（落ちても続きから） ============ */
/* 文字と数字は localStorage、写真だけ容量の大きい IndexedDB に置く */
const LS="meinohama:local:v1";
const DB_NAME="meinohama",DB_STORE="photos";
var saveTmr=null,phTmr=null;   /* 起動時の setVolt→mark→saveSoon より先に用意しておく */
function saveSoon(){clearTimeout(saveTmr);saveTmr=setTimeout(saveLocal,400);}
function savePhotosSoon(){clearTimeout(phTmr);phTmr=setTimeout(savePhotos,300);}

function saveLocal(){
  try{
    const rm=ITEMS.find(x=>x.id==="rm");
    const mt={};Object.keys(memo).forEach(id=>{if(memo[id].t)mt[id]=memo[id].t;});
    localStorage.setItem(LS,JSON.stringify({
      v:1,at:Date.now(),info,val,meta,hideVolt,memo:mt,rmN:rm?rm.f.length:2
    }));
  }catch(e){}
}
function restoreLocal(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(LS)||"null");}catch(e){}
  if(!s||s.v!==1)return;
  Object.assign(info,s.info||{});
  const rm=ITEMS.find(x=>x.id==="rm");
  if(rm)for(let n=rm.f.length+1;n<=(s.rmN||2);n++)rm.f.push({id:"r"+n,lab:"備考 "+n,t:"text",prev:""});
  Object.assign(val,s.val||{});
  Object.assign(meta,s.meta||{});
  hideVolt=!!s.hideVolt;
  Object.keys(s.memo||{}).forEach(id=>{memoOf(id).t=s.memo[id];});
  Object.keys(val).forEach(k=>{
    const f=fieldByKey(k);if(!f)return;
    stat[k]="";
    const v=nz(val[k]);
    if(v!==null){const r=check(f,v);if(r&&r.lv!=="ok")stat[k]=r.lv;}
    if(f.t==="choice"&&!val[k])stat[k]="warn";
    if(f.t==="choice"&&val[k]==="不")stat[k]="fault";
  });
}

const idbReq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{r.result.createObjectStore(DB_STORE);};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}
async function savePhotos(){
  try{
    const db=await idb();
    const st=db.transaction(DB_STORE,"readwrite").objectStore(DB_STORE);
    st.clear();
    Object.keys(memo).forEach(id=>{if(memo[id].ph&&memo[id].ph.length)st.put(memo[id].ph,id);});
  }catch(e){}
}
async function loadPhotos(){
  try{
    const db=await idb();
    const st=db.transaction(DB_STORE,"readonly").objectStore(DB_STORE);
    const ks=await idbReq(st.getAllKeys()),vs=await idbReq(st.getAll());
    let any=false;
    ks.forEach((id,i)=>{if(vs[i]&&vs[i].length){memoOf(id).ph=vs[i];any=true;}});
    if(any)draw();
  }catch(e){}
}
async function wipeLocal(){
  try{localStorage.removeItem(LS);}catch(e){}
  try{
    const db=await idb();
    db.transaction(DB_STORE,"readwrite").objectStore(DB_STORE).clear();
  }catch(e){}
}

$("#btnHist").onclick=openHistory;
$("#btnRep").onclick=openSummary;
$("#hideChk").onchange=e=>{hideVolt=e.target.checked;draw();saveSoon();};
$("#voltChk").onchange=e=>{
  setVolt(e.target.checked);
  $("#voltBar").classList.toggle("off",!e.target.checked);
  draw();saveSoon();
};
restoreLocal();
draw();
loadPhotos();
</script>
